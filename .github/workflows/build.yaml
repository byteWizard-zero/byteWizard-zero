name: README build

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: byteWizard-zero
        run: python today.py

      - name: Commit and Push Changes
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |-
          git config --global user.email "soumyaranjanjana2023@gmail.com"
          git config --global user.name "byteWizard-zero/GitHub-Actions-Bot"
          git add dark_mode.svg light_mode.svg cache/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Updated README [skip ci]"
            if [ -n "$ACCESS_TOKEN" ]; then
              git push "https://x-access-token:${ACCESS_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
            else
              git push origin HEAD:${{ github.ref_name }}
            fi
          else
            echo "No changes to commit"
          fi


